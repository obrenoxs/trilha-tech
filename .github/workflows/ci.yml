name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  conteudo:
    name: Validar conteúdo
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Validar catálogo, trilhas, quiz e PDFs
        run: python3 conteudo/ferramentas/validar.py

  backend:
    name: Testes do backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: trilhatech_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: senha-descartavel-do-ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d trilhatech_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DB_URL: jdbc:postgresql://localhost:5432/trilhatech_test
      TEST_DB_USER: postgres
      TEST_DB_PASSWORD: senha-descartavel-do-ci
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - run: chmod +x mvnw
      - name: Testes unitários e de integração
        run: ./mvnw -B verify

  docker:
    name: Imagem Docker sobe e responde
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: trilhatech_smoke
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: senha-descartavel-do-ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d trilhatech_smoke"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v6
      - name: Construir a imagem
        run: docker build -t trilha-tech-api .
      - name: Subir o contêiner
        run: |
          docker run -d --name api --network host \
            -e DB_URL=jdbc:postgresql://localhost:5432/trilhatech_smoke \
            -e DB_USER=postgres \
            -e DB_PASSWORD=senha-descartavel-do-ci \
            trilha-tech-api
      - name: Esperar o conteúdo carregar
        run: |
          for i in $(seq 1 60); do
            total=$(curl -s localhost:8080/api/areas | jq 'length' 2>/dev/null || echo 0)
            if [ "$total" = "8" ]; then echo "Pronto: 8 áreas"; exit 0; fi
            sleep 2
          done
          echo "A aplicação não carregou as 8 áreas em 2 minutos"
          exit 1
      - name: Conferir o contêiner
        run: |
          test "$(docker exec api whoami)" = "app"
          curl -s localhost:8080/api/trilhas/java-e-spring | jq -e '.slug == "java-e-spring"'
          test "$(curl -s localhost:8080/api/trilhas/java-e-spring/pdf | head -c 5)" = "%PDF-"
          curl -s -o /dev/null -w '%{http_code}\n' localhost:8080/v3/api-docs | grep -q 200
          docker image ls trilha-tech-api
      - name: Logs do contêiner (se falhar)
        if: failure()
        run: docker logs api