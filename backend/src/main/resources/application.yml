spring:
  application:
    name: trilha-tech-api
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

trilhatech:
  cors:
    origens: ${CORS_ORIGENS:http://localhost:3000,http://localhost:5173}
  assistente:
    gemini:
      chave: ${GEMINI_API_KEY:}
      modelo: ${GEMINI_MODELO:gemini-3.5-flash-lite}
      url-base: https://generativelanguage.googleapis.com/v1beta
      timeout-segundos: 30
      maximo-de-tokens: 800
    limite:
      mensagens-por-dia: 400
      por-minuto-global: 12
      por-minuto-por-visitante: 5
      por-hora-por-visitante: 30
  limites:
    corpo-maximo-bytes: 100000
springdoc:
  override-with-generic-response: false
  api-docs:
    enabled: ${SWAGGER_HABILITADO:true}
  swagger-ui:
    enabled: ${SWAGGER_HABILITADO:true}
    operations-sorter: alpha
    tags-sorter: alpha
    
server:
  port: ${PORT:8080}